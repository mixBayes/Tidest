name: Verify release
run-name: Verify release ${{ inputs.tag }}

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag (for example, v2.0.4)
        required: true
        type: string
      update_deployment:
        description: Mark the matching release deployment successful after verification
        type: boolean
        default: false

permissions:
  contents: read
  attestations: read

jobs:
  verify:
    if: github.repository == 'mixBayes/Tidest'
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      source_commit: ${{ steps.verify.outputs.source_commit }}
    steps:
      - name: Check out verification tools and version tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release verification failure handling
        run: |
          python3 scripts/tests/test_verify_release.py
          python3 scripts/tests/test_sync_release_deployment.py

      - name: Download and verify the published files
        id: verify
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          download_dir="$(mktemp -d "$RUNNER_TEMP/tidest-verify.XXXXXX")"
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --dir "$download_dir"
          bash scripts/verify-release.sh "$RELEASE_TAG" "$download_dir"
          xcrun stapler validate "$download_dir/Tidest-${RELEASE_TAG#v}.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 \
            "$download_dir/Tidest-${RELEASE_TAG#v}.dmg"
          echo "source_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"
          echo "Verified [Tidest ${RELEASE_TAG#v}](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG): release proof, all four assets, build provenance and Apple notarization." >> "$GITHUB_STEP_SUMMARY"

  sync-deployment:
    name: Update verified deployment status
    needs: verify
    if: inputs.update_deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      VERIFIED_COMMIT: ${{ needs.verify.outputs.source_commit }}
    steps:
      - name: Check out deployment status tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Update the matching release deployment
        shell: bash
        run: bash scripts/sync-release-deployment.sh "$RELEASE_TAG" "$VERIFIED_COMMIT"
